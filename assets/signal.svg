<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="A glowing signal over a city skyline">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.7" stop-color="#141036"/>
      <stop offset="1" stop-color="#2a1745"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fde68a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.75" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-80%" width="220%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="cloud" x="-40%" y="-300%" width="180%" height="700%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="900" height="300" fill="url(#sky)"/>

  <!-- drifting clouds -->
  <g fill="#8b7ec8" opacity="0.28" filter="url(#cloud)">
    <ellipse cx="180" cy="70" rx="120" ry="16"><animateTransform attributeName="transform" type="translate" values="-40 0; 60 0; -40 0" dur="18s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="720" cy="48" rx="140" ry="14"><animateTransform attributeName="transform" type="translate" values="50 0; -50 0; 50 0" dur="22s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="470" cy="150" rx="100" ry="12"><animateTransform attributeName="transform" type="translate" values="-30 0; 40 0; -30 0" dur="16s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- light beam -->
  <g>
    <polygon points="420,300 480,300 530,92 370,92" fill="url(#beam)" filter="url(#blur2)">
      <animate attributeName="opacity" values="1;0.72;1;0.9;1" keyTimes="0;0.2;0.4;0.7;1" dur="3.6s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- expanding rings -->
  <g fill="none" stroke="#fde68a" stroke-width="2">
    <ellipse cx="450" cy="92" rx="80" ry="58">
      <animate attributeName="rx" values="80;190" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="58;130" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="450" cy="92" rx="80" ry="58">
      <animate attributeName="rx" values="80;190" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="58;130" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- signal disc -->
  <ellipse cx="450" cy="92" rx="92" ry="68" fill="#fde68a" opacity="0.55" filter="url(#blur)">
    <animate attributeName="opacity" values="0.55;0.8;0.55" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="450" cy="92" rx="78" ry="58" fill="url(#disc)"/>
  <path d="M0,-8 L4,-14 L6,-8 Q12,-12 22,-10 Q18,-4 20,4 Q14,0 10,6 Q6,2 0,12 Q-6,2 -10,6 Q-14,0 -20,4 Q-18,-4 -22,-10 Q-12,-12 -6,-8 L-4,-14 Z" transform="translate(450 94) scale(3.1)" fill="#0b0f1d"/>

