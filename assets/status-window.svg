<svg xmlns="http://www.w3.org/2000/svg" width="760" height="566" viewBox="0 0 760 566" role="img" aria-label="Status window: Ashish Chandra Acharjee, student developer, hackathon rookie">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07122b" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#040a1a" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Courier New', 'DejaVu Sans Mono', monospace; }
      .title { font-size: 24px; font-weight: 700; letter-spacing: 8px; fill: #e0f2fe; }
      .k { font-size: 15px; fill: #60a5fa; letter-spacing: 2px; }
      .v { font-size: 15px; fill: #f1f5f9; font-weight: 700; }
      .lab { font-size: 15px; fill: #bfdbfe; font-weight: 700; letter-spacing: 2px; }
      .det { font-size: 11px; fill: #64748b; }
      .tag { font-size: 15px; fill: #67e8f9; font-weight: 700; }
      .quest { font-size: 13px; fill: #fde68a; letter-spacing: 1px; }
    </style>
  </defs>

  <rect x="6" y="6" width="748" height="554" rx="6" fill="url(#panel)"/>
  <rect x="6" y="6" width="748" height="554" rx="6" fill="none" stroke="#3b82f6" stroke-width="2.5" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="1;0.45;1" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="16" y="16" width="728" height="534" rx="3" fill="none" stroke="#1d4ed8" stroke-opacity="0.45"/>

  <g filter="url(#glow)"><text x="380.0" y="58" text-anchor="middle" class="title">[ STATUS ]</text></g>
  <line x1="46" y1="76" x2="714" y2="76" stroke="#3b82f6" stroke-opacity="0.5"/>

  <text x="46"  y="110" class="k">NAME</text>   <text x="190" y="110" class="v">Ashish Chandra Acharjee</text>
  <text x="46"  y="138" class="k">CLASS</text>  <text x="190" y="138" class="v">Full-Stack Builder (in training)</text>
  <text x="46"  y="166" class="k">TITLE</text>  <text x="190" y="166" class="v">The Back-to-Back Hackathoner</text>
  <text x="46"  y="194" class="k">GUILD</text>  <text x="190" y="194" class="v">GNIT, Kolkata · B.Tech IT '29</text>
  <line x1="46" y1="214" x2="714" y2="214" stroke="#3b82f6" stroke-opacity="0.35" stroke-dasharray="4 5"/>
  <text x="46" y="240" class="k">ABILITIES</text>

  
  <text x="46" y="272" class="lab">FRONTEND</text>
  <text x="46" y="288" class="det">React · Next.js · TypeScript</text>
  <rect x="300" y="259" width="330" height="14" rx="3" fill="#0b1b3a" stroke="#1e4fa3" stroke-opacity="0.6"/>
  <rect x="300" y="259" height="14" rx="3" fill="url(#bar)" width="0">
    <animate attributeName="width" values="0;257;257;0" keyTimes="0;0.25;0.9;1" dur="9s" begin="0.00s" repeatCount="indefinite"/>
  </rect>
  <text x="652" y="272" class="tag">B</text>
  <text x="46" y="316" class="lab">BACKEND</text>
  <text x="46" y="332" class="det">Node · Express · FastAPI</text>
  <rect x="300" y="303" width="330" height="14" rx="3" fill="#0b1b3a" stroke="#1e4fa3" stroke-opacity="0.6"/>
  <rect x="300" y="303" height="14" rx="3" fill="url(#bar)" width="0">
    <animate attributeName="width" values="0;224;224;0" keyTimes="0;0.25;0.9;1" dur="9s" begin="0.15s" repeatCount="indefinite"/>
  </rect>
  <text x="652" y="316" class="tag">B</text>
  <text x="46" y="360" class="lab">AI / ML</text>
  <text x="46" y="376" class="det">PyTorch · RAG · Agents</text>
  <rect x="300" y="347" width="330" height="14" rx="3" fill="#0b1b3a" stroke="#1e4fa3" stroke-opacity="0.6"/>
  <rect x="300" y="347" height="14" rx="3" fill="url(#bar)" width="0">
    <animate attributeName="width" values="0;172;172;0" keyTimes="0;0.25;0.9;1" dur="9s" begin="0.30s" repeatCount="indefinite"/>
  </rect>
  <text x="652" y="360" class="tag">C ▲</text>
  <text x="46" y="404" class="lab">SECURITY</text>
  <text x="46" y="420" class="det">Watermarking · PQ-Crypto</text>
  <rect x="300" y="391" width="330" height="14" rx="3" fill="#0b1b3a" stroke="#1e4fa3" stroke-opacity="0.6"/>
  <rect x="300" y="391" height="14" rx="3" fill="url(#bar)" width="0">
    <animate attributeName="width" values="0;139;139;0" keyTimes="0;0.25;0.9;1" dur="9s" begin="0.45s" repeatCount="indefinite"/>
  </rect>
  <text x="652" y="404" class="tag">C ▲</text>
  <text x="46" y="448" class="lab">TEAMWORK</text>
  <text x="46" y="464" class="det">2 hackathons · 1 squad</text>
  <rect x="300" y="435" width="330" height="14" rx="3" fill="#0b1b3a" stroke="#1e4fa3" stroke-opacity="0.6"/>
  <rect x="300" y="435" height="14" rx="3" fill="url(#bar)" width="0">
    <animate attributeName="width" values="0;284;284;0" keyTimes="0;0.25;0.9;1" dur="9s" begin="0.60s" repeatCount="indefinite"/>
  </rect>
  <text x="652" y="448" class="tag">B+</text>

  <line x1="46" y1="478" x2="714" y2="478" stroke="#3b82f6" stroke-opacity="0.35" stroke-dasharray="4 5"/>
  <text x="46" y="508" class="quest">
    ⚔  ACTIVE QUEST : Ship the next project  ·  REWARD : +XP
    <animate attributeName="fill-opacity" values="1;1;0.4;1;1" keyTimes="0;0.6;0.7;0.8;1" dur="2.4s" repeatCount="indefinite"/>
  </text>
  <text x="46" y="532" class="det">* Ranks are self-assessed and rising. The window updates as I do.</text>
</svg>