<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" role="img" aria-label="Pac-Man chasing a ghost along a row of dots">
  <defs>
    <mask id="eaten">
      <rect width="900" height="56" fill="#fff"/>
      <rect x="0" y="0" height="56" width="0" fill="#000">
        <animate attributeName="width" values="0;930;930" keyTimes="0;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <!-- maze corridor walls -->
  <rect x="2" y="5" width="896" height="46" rx="23" fill="none" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="8" y="11" width="884" height="34" rx="17" fill="none" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="1"/>

  <!-- pellets (hidden as pac-man passes) -->
  <g mask="url(#eaten)">
    <circle cx="30" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="58" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="87" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="116" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="144" cy="28" r="6" fill="#fde68a"><animate attributeName="r" values="5;7.5;5" dur="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="172" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="201" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="230" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="258" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="286" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="315" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="344" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="372" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="400" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="429" cy="28" r="6" fill="#fde68a"><animate attributeName="r" values="5;7.5;5" dur="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="458" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="486" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="514" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="543" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="572" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="600" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="628" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="657" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="686" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="714" cy="28" r="6" fill="#fde68a"><animate attributeName="r" values="5;7.5;5" dur="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="742" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="771" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="800" cy="28" r="2.8" fill="#fde68a"/>
    <circle cx="828" cy="28" r="2.8" fill="#fde68a"/>
  </g>

  <!-- scared ghost, always one step ahead -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="70 28; 1000 28; 1000 28" keyTimes="0;0.92;1" dur="8s" repeatCount="indefinite"/>
    <path d="M-11,11 V-3 A11,11 0 0 1 11,-3 V11 L7.3,7.5 L3.7,11 L0,7.5 L-3.7,11 L-7.3,7.5 Z" fill="#60a5fa"/>
    <circle cx="-4" cy="-3" r="2.4" fill="#fff"/><circle cx="4" cy="-3" r="2.4" fill="#fff"/>
    <circle cx="-4" cy="-3" r="1.1" fill="#1e3a8a"/><circle cx="4" cy="-3" r="1.1" fill="#1e3a8a"/>
    <path d="M-7,4 l2.3,-2 2.3,2 2.3,-2 2.3,2 2.3,-2 2.3,2" fill="none" stroke="#fff" stroke-width="1.2"/>
  </g>

  <!-- pac-man -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 28; 930 28; 930 28" keyTimes="0;0.92;1" dur="8s" repeatCount="indefinite"/>
    <path fill="#facc15">
      <animate attributeName="d" dur="0.32s" repeatCount="indefinite"
        values="M0,0 L10.4,-6 A12,12 0 1 0 10.4,6 Z;M0,0 L11.98,-0.6 A12,12 0 1 0 11.98,0.6 Z;M0,0 L10.4,-6 A12,12 0 1 0 10.4,6 Z"/>
    </path>
    <circle cx="1" cy="-6" r="1.6" fill="#0f172a"/>
  </g>
</svg>