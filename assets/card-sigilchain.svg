<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="Case file 5: SigilChain. Every leak leaves a fingerprint. Stack: Python, Document Security, Watermarking, Post-Quantum Crypto.">
