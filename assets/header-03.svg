  <g transform="translate(830 58)"><circle r="6" fill="#38bdf8"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="2s" repeatCount="indefinite"/><circle cx="18" r="5" fill="#38bdf8"/><circle cx="-18" r="5" fill="#ef4444"/></g></g>
