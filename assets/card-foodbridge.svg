<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="Case file 2: FoodBridge+. No meal left behind. Stack: React, Vite, Node.js, Express, Snowflake, Cloudinary.">
  <defs>
