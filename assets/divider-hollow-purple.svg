<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-label="Blue and red cursed-energy orbs collide and merge into a purple blast">
  <defs>
    <radialGradient id="orb_blue"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0ea5e9"/></radialGradient>
    <radialGradient id="orb_red"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#fca5a5"/><stop offset="1" stop-color="#dc2626"/></radialGradient>
    <radialGradient id="orb_purple"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#e9d5ff"/><stop offset="0.65" stop-color="#a855f7"/><stop offset="1" stop-color="#4c1d95"/></radialGradient>
