  </defs>
  <rect x="20" y="69.0" width="860" height="2" fill="url(#line)" opacity="0.55"/>
  <g>
      <animateTransform attributeName="transform" type="translate" values="70 70.0;446.0 70.0;446.0 70.0" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite"/>
