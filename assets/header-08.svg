    <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/> ]</text>
  <text x="450.0" y="78" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="900" letter-spacing="5" fill="#2dd4bf" opacity="0.5" filter="url(#gl)">TRAINING GROUNDS</text>
  <text x="450.0" y="78" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="900" letter-spacing="5" fill="url(#sh)">TRAINING GROUNDS</text>
  <text x="450.0" y="106" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-style="italic" fill="#94a3b8">Total concentration. Every day.</text>
  <g transform="translate(70 58)"><path d="M-20,0 q5,-10 10,0 t10,0 t10,0 t10,0" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="1.4s" repeatCount="indefinite"/></path></g>
  <g transform="translate(830 58)"><path d="M-20,0 q5,-10 10,0 t10,0 t10,0 t10,0" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="1.4s" repeatCount="indefinite"/></path></g>
