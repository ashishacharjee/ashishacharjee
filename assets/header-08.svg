<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-label="Issue 08: TRAINING GROUNDS. Total concentration. Every day.">
  <defs>
    <linearGradient id="sh" gradientUnits="userSpaceOnUse" x1="-340" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="0.5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#f8fafc"/>
      <animate attributeName="x1" values="-340;900" dur="4.5s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1240" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset="0.5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
    <filter id="gl" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
